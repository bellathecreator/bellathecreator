name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: bellathecreator
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FF8DA1&color_dots=%23FFE5EA,%23FFC7D1,%23FFABB9,%23FF8FA1,%23FF8DA1
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23FF8DA1&color_dots=%232D1720,%234A202C,%236B2B3B,%23A9445A,%23FF8DA1

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
